<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>绘台 · 暗房艺术工坊</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 极简暗房深邃光场 -->
    <div class="atelier-ambient" aria-hidden="true"></div>

    <div class="atelier-shell">
      <!-- ================= 顶栏：策展人级极简导航 ================= -->
      <header class="atelier-topbar">
        <div class="topbar-brand">
          <span class="brand-monogram">◇</span>
          <span class="brand-name">绘台</span>
          <span class="brand-tag">ATELIER 4.5</span>
        </div>

        <nav class="topbar-nav" role="tablist">
          <button type="button" class="nav-link active" data-tab="tab-canvas" role="tab" aria-selected="true">
            <span>画布</span>
          </button>
          <button type="button" class="nav-link" data-tab="tab-history" role="tab" aria-selected="false">
            <span>画廊</span>
            <span class="nav-num" id="tab-gallery-count">0</span>
          </button>
          <button type="button" class="nav-link" data-tab="tab-covers" role="tab" aria-selected="false">
            <span>载体</span>
            <span class="nav-num" id="tab-cover-count">0</span>
          </button>
          <button type="button" class="nav-link" data-tab="tab-stego" role="tab" aria-selected="false">
            <span>拆封</span>
          </button>
        </nav>

        <div class="topbar-right">
          <div class="status-indicator-pill">
            <span class="status-orb" id="status-dot"></span>
            <span class="status-text" id="status-api">连接中</span>
          </div>
          <button type="button" id="btn-toggle-theme" class="theme-btn" title="切换深/浅主题">
            <span class="theme-icon">◐</span>
          </button>
        </div>
      </header>

      <!-- 隐藏状态节点（业务逻辑读取） -->
      <div hidden>
        <span id="status-model">—</span>
        <span id="status-gallery">0</span>
        <span id="status-covers">0</span>
      </div>

      <!-- ================= 主体工作区 ================= -->
      <div class="atelier-body">
        <!-- 左侧：创作者调色控制台 (Composer) -->
        <aside class="atelier-composer composer" aria-label="创作控制面板">
          <form id="draw-form" class="composer-stack">
            <!-- 1. 灵感与提示词 -->
            <div class="composer-group">
              <div class="group-header">
                <label for="prompt" class="group-title">画面意境</label>
                <div class="group-actions">
                  <button type="button" id="btn-random-prompt" class="text-btn" title="抽取画面灵感">随机灵感</button>
                  <button type="button" id="btn-clear-prompt" class="text-btn">清空</button>
                </div>
              </div>
              <div class="prompt-box-wrap">
                <textarea
                  id="prompt"
                  name="prompt"
                  rows="4"
                  required
                  placeholder="长发少女，夜雨旗袍，侧光，看着镜头，唯美光影..."
                ></textarea>
                <div class="quick-tags-strip" id="quick-tags-container">
                  <span class="tag-pill" data-tag="雨夜霓虹, 湿润发丝, 电影级光影">雨夜霓虹</span>
                  <span class="tag-pill" data-tag="白发红瞳, 绝美五官, 侧光特写">白发红瞳</span>
                  <span class="tag-pill" data-tag="古风旗袍, 刺绣金线, 柔美光晕">华美旗袍</span>
                  <span class="tag-pill" data-tag="赛博机能, 机械义肢, 发光线缆">赛博机能</span>
                  <span class="tag-pill" data-tag="水下光斑, 漂浮长发, 梦幻水彩">梦幻水境</span>
                </div>
              </div>
            </div>

            <!-- 2. 风格调色预设 -->
            <div class="composer-group">
              <div class="group-header">
                <span class="group-title">画风调色</span>
                <span class="current-tag" id="preset-summary">老五样</span>
              </div>
              <div class="preset-pill-grid" id="preset-grid" role="radiogroup" aria-label="画风预设"></div>
            </div>

            <!-- 3. 画幅比例 -->
            <div class="composer-group">
              <div class="group-header">
                <span class="group-title">画幅比例</span>
                <span class="current-tag" id="size-summary">竖图</span>
              </div>
              <div class="size-pill-grid" id="size-row" role="radiogroup" aria-label="画幅比例"></div>
            </div>

            <!-- 4. 画师风格叠加 -->
            <div class="composer-group">
              <div class="group-header">
                <label for="artists" class="group-title">画师叠加</label>
                <span class="group-note">可选</span>
              </div>
              <div class="artist-input-wrap">
                <input
                  id="artists"
                  name="artists"
                  type="text"
                  class="minimal-input"
                  placeholder="例如：artist:wlop, {artist:guweiz}"
                  autocomplete="off"
                />
              </div>
              <div class="artist-quick-bank">
                <button type="button" class="artist-chip" data-artist="artist:wlop">wlop</button>
                <button type="button" class="artist-chip" data-artist="artist:guweiz">guweiz</button>
                <button type="button" class="artist-chip" data-artist="artist:fuzichoco">藤原</button>
                <button type="button" class="artist-chip" data-artist="artist:mika pikazo">Mika</button>
                <button type="button" class="artist-chip" data-artist="artist:ask (artist)">Ask</button>
              </div>
            </div>

            <!-- 5. 高级开关 -->
            <div class="toggles-cluster">
              <label class="toggle-row">
                <span class="toggle-name">NSFW 模式</span>
                <input id="nsfw" type="checkbox" />
                <span class="toggle-dot"></span>
              </label>

              <label class="toggle-row">
                <span class="toggle-name">自动脸型增强</span>
                <input id="face" type="checkbox" checked />
                <span class="toggle-dot"></span>
              </label>

              <label class="toggle-row">
                <span class="toggle-name">隐写伪装</span>
                <input id="stego" type="checkbox" />
                <span class="toggle-dot"></span>
              </label>
            </div>

            <!-- 隐写密码 -->
            <div class="composer-group" id="stego-password-field" hidden>
              <div class="group-header">
                <label for="stego-password" class="group-title">提取密码</label>
                <span class="group-note">可留空</span>
              </div>
              <input
                id="stego-password"
                type="password"
                class="minimal-input"
                placeholder="设置封包密码"
                autocomplete="off"
              />
            </div>

            <!-- 6. 主渲染出图按钮 -->
            <div class="composer-action">
              <button id="draw-button" type="submit" class="btn-atelier-draw">
                <span class="btn-spinner" id="draw-spinner" hidden></span>
                <span id="draw-btn-text">出图</span>
                <kbd class="btn-kbd">↵</kbd>
              </button>
              <p class="composer-hint" id="form-hint">中文将由智能翻译转为官方标签</p>
            </div>
          </form>
        </aside>

        <!-- 右侧：艺术展厅视口 (Workspace) -->
        <main class="atelier-workspace workspace">
          <!-- 选项卡 1：主画布 -->
          <section id="tab-canvas" class="atelier-pane active" role="tabpanel">
            <div class="canvas-stage" id="canvas-viewport">
              <!-- 纯粹空状态 -->
              <div class="canvas-zen-empty" id="result-empty">
                <p>等待出图</p>
              </div>

              <!-- 成图展示画框（100% 居中无任何遮挡） -->
              <div class="canvas-art-frame" id="artwork-frame" hidden>
                <img id="result-image" class="art-img" alt="当前生成作品" />
              </div>

              <!-- 悬浮艺术参数 Dock（极简半透明、不占地） -->
              <div class="floating-dock" id="result-dock" hidden>
                <div class="dock-row">
                  <div class="dock-specs" id="result-sheet">
                    <span class="spec-item" id="sheet-preset">—</span>
                    <span class="spec-sep">/</span>
                    <span class="spec-item font-mono" id="sheet-size">—</span>
                    <span class="spec-sep">/</span>
                    <span class="spec-item" id="sheet-nsfw">—</span>
                    <span class="spec-sep">/</span>
                    <span class="spec-item" id="sheet-face">—</span>
                  </div>

                  <div class="dock-buttons">
                    <button type="button" id="download-result" class="dock-act-btn" disabled>保存原图</button>
                    <button type="button" id="download-stego" class="dock-act-btn dock-act-btn--stego" hidden>保存隐写图</button>
                  </div>
                </div>

                <details class="dock-details">
                  <summary class="dock-summary">提示词详情</summary>
                  <div class="dock-prompts-grid">
                    <div class="prompt-col">
                      <div class="prompt-col-head">
                        <span>正面提示词</span>
                        <button type="button" class="copy-btn" id="btn-copy-prompt">复制</button>
                      </div>
                      <p class="prompt-text font-mono" id="sheet-prompt">—</p>
                    </div>
                    <div class="prompt-col">
                      <div class="prompt-col-head">
                        <span>负面提示词</span>
                        <button type="button" class="copy-btn" id="btn-copy-negative">复制</button>
                      </div>
                      <p class="prompt-text font-mono prompt-text--muted" id="sheet-negative">—</p>
                    </div>
                  </div>
                </details>

                <div class="dock-note" id="result-note" hidden></div>
              </div>
            </div>
          </section>

          <!-- 选项卡 2：画廊档案 -->
          <section id="tab-history" class="atelier-pane" role="tabpanel" hidden>
            <div class="subpage-view">
              <div class="subpage-top">
                <h2 class="subpage-heading">成图画廊</h2>
                <button type="button" id="btn-refresh-gallery" class="subpage-tool-btn">刷新列表</button>
              </div>
              <div class="gallery-flow-grid" id="gallery"></div>
            </div>
          </section>

          <!-- 选项卡 3：载体图库 -->
          <section id="tab-covers" class="atelier-pane" role="tabpanel" hidden>
            <div class="subpage-view">
              <div class="subpage-top">
                <h2 class="subpage-heading">载体图库</h2>
                <label class="subpage-tool-btn subpage-tool-btn--accent">
                  <span>上传载体</span>
                  <input id="cover-file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" hidden />
                </label>
              </div>

              <!-- 极简拖拽区 -->
              <div class="zen-drop-zone" id="cover-drop-zone">
                <p class="drop-text">拖拽载体图片至此处上传</p>
                <span class="drop-subtext">PNG / JPG / WEBP / BMP，单张不超过 12MB</span>
                <span id="cover-hint" hidden></span>
              </div>

              <div class="covers-flow-grid" id="covers"></div>
            </div>
          </section>

          <!-- 选项卡 4：隐写拆封 -->
          <section id="tab-stego" class="atelier-pane" role="tabpanel" hidden>
            <div class="subpage-view">
              <div class="subpage-top">
                <h2 class="subpage-heading">隐写拆封工坊</h2>
              </div>

              <div class="stego-grid-layout">
                <div class="stego-drop-panel">
                  <div class="zen-drop-zone" id="extract-drop-zone">
                    <p class="drop-text">拖拽原始隐写 PNG 到此处</p>
                    <span class="drop-subtext">使用未经压缩的原始隐写文件</span>
                    <label class="subpage-tool-btn" style="margin-top: 14px;">
                      <span>选择本地文件</span>
                      <input id="extract-file" type="file" accept="image/png" hidden />
                    </label>
                  </div>

                  <div style="margin-top: 14px;">
                    <input
                      id="extract-password"
                      type="password"
                      class="minimal-input"
                      placeholder="解密密码（无密码可留空）"
                      autocomplete="off"
                    />
                  </div>

                  <p class="extract-tip-text" id="extract-hint"></p>
                </div>

                <div class="stego-preview-panel" id="extract-result-panel" hidden>
                  <div class="stego-img-wrap">
                    <img id="extract-preview-img" alt="拆封还原成图" />
                  </div>
                  <button type="button" id="btn-download-extracted" class="btn-atelier-draw" style="margin-top: 14px; width: 100%;">
                    <span>保存还原原图</span>
                  </button>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- 全局轻量 Toast 提示 -->
    <div id="toast" class="atelier-toast" hidden role="status" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>

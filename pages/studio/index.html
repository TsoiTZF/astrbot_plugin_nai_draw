<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>绘台</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="stage">
      <figure class="canvas" id="result-frame">
        <img id="result-image" alt="当前成图" hidden />
        <figcaption id="result-empty">
          <span class="empty-mark">NAI</span>
          还没有图
        </figcaption>
      </figure>

      <div class="veil" aria-hidden="true"></div>

      <header class="hud-top">
        <p class="brand">叶子的逼</p>
        <h1>绘台</h1>
        <dl class="meters">
          <div>
            <dt>上游</dt>
            <dd id="status-api">读取中</dd>
          </div>
          <div>
            <dt>模型</dt>
            <dd id="status-model">—</dd>
          </div>
          <div>
            <dt>成图</dt>
            <dd id="status-gallery">0</dd>
          </div>
          <div>
            <dt>载体</dt>
            <dd id="status-covers">0</dd>
          </div>
        </dl>
      </header>

      <form id="draw-form" class="hud-left">
        <label class="field">
          <span>画面</span>
          <textarea
            id="prompt"
            name="prompt"
            rows="7"
            required
            placeholder="长发女孩，夜雨旗袍，侧光，看着镜头"
          ></textarea>
        </label>

        <fieldset class="options" id="preset-grid">
          <legend>画风</legend>
        </fieldset>

        <fieldset class="options formats" id="size-row">
          <legend>画幅</legend>
        </fieldset>

        <label class="field">
          <span>个人画师</span>
          <input
            id="artists"
            name="artists"
            type="text"
            placeholder="artist:wlop, {artist:guweiz}"
            autocomplete="off"
          />
        </label>

        <div class="toggles">
          <label class="switch">
            <input id="nsfw" type="checkbox" />
            <span>NSFW</span>
          </label>
          <label class="switch">
            <input id="face" type="checkbox" checked />
            <span>自动脸型</span>
          </label>
          <label class="switch">
            <input id="stego" type="checkbox" />
            <span>隐写</span>
          </label>
        </div>

        <label class="field" id="stego-password-field" hidden>
          <span>隐写密码，可留空</span>
          <input id="stego-password" type="password" autocomplete="off" />
        </label>

        <p class="hint" id="form-hint">中文会先转成标签，再送给 NAI 4.5。</p>
        <button id="draw-button" type="submit">出图</button>
      </form>

      <aside class="hud-right">
        <p id="lightbox-meta">写画面，再出图。</p>
        <dl class="facts" id="result-sheet" hidden>
          <div>
            <dt>预设</dt>
            <dd id="sheet-preset">—</dd>
          </div>
          <div>
            <dt>尺寸</dt>
            <dd id="sheet-size">—</dd>
          </div>
          <div>
            <dt>NSFW</dt>
            <dd id="sheet-nsfw">—</dd>
          </div>
          <div>
            <dt>脸型</dt>
            <dd id="sheet-face">—</dd>
          </div>
        </dl>
        <details class="prompt-sheet">
          <summary>提示词</summary>
          <p id="sheet-prompt">—</p>
          <p id="sheet-negative">—</p>
        </details>
        <p class="note" id="result-note" hidden></p>
        <div class="actions">
          <button id="download-result" type="button" disabled>下载成图</button>
          <button id="download-stego" type="button" hidden>下载隐写 PNG</button>
        </div>
      </aside>

      <section class="hud-bottom" aria-labelledby="gallery-title">
        <div class="reel">
          <div class="reel-label">
            <h2 id="gallery-title">最近</h2>
            <p>点开放到画布。</p>
          </div>
          <div class="thumbs" id="gallery"></div>
        </div>
        <div class="reel">
          <div class="reel-label">
            <h2 id="cover-title">载体</h2>
            <form id="cover-form">
              <label class="file-link">
                <input id="cover-file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" />
                <span>加入</span>
              </label>
              <p class="hint" id="cover-hint"></p>
            </form>
          </div>
          <div class="thumbs" id="covers"></div>
        </div>
        <form id="extract-form" class="extract">
          <h2 id="extract-title">拆封</h2>
          <input id="extract-password" type="password" placeholder="密码，可留空" autocomplete="off" />
          <label class="file-link">
            <input id="extract-file" type="file" accept="image/png" />
            <span>原始 PNG</span>
          </label>
          <p class="hint" id="extract-hint"></p>
        </form>
      </section>
    </div>

    <div id="toast" class="toast" hidden role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>

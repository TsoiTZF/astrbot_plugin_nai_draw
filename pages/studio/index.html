<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>绘台</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <header class="brand">
          <p class="mark">NAI 4.5</p>
          <h1>绘台</h1>
        </header>

        <dl class="meters">
          <div>
            <dt>上游</dt>
            <dd id="status-api">读取中</dd>
          </div>
          <div>
            <dt>模型</dt>
            <dd id="status-model">—</dd>
          </div>
          <div>
            <dt>成图</dt>
            <dd id="status-gallery">0</dd>
          </div>
          <div>
            <dt>载体</dt>
            <dd id="status-covers">0</dd>
          </div>
        </dl>

        <form id="draw-form" class="panel">
          <label class="field">
            <span>画面</span>
            <textarea
              id="prompt"
              name="prompt"
              rows="8"
              required
              placeholder="长发女孩，夜雨旗袍，侧光，看着镜头"
            ></textarea>
          </label>

          <fieldset class="chips" id="preset-grid">
            <legend>画风</legend>
          </fieldset>

          <fieldset class="choices sizes" id="size-row">
            <legend>画幅</legend>
          </fieldset>

          <label class="field">
            <span>个人画师</span>
            <input
              id="artists"
              name="artists"
              type="text"
              placeholder="artist:wlop, {artist:guweiz}"
              autocomplete="off"
            />
          </label>

          <div class="toggles">
            <label class="switch">
              <input id="nsfw" type="checkbox" />
              <span>NSFW</span>
            </label>
            <label class="switch">
              <input id="face" type="checkbox" checked />
              <span>自动脸型</span>
            </label>
            <label class="switch">
              <input id="stego" type="checkbox" />
              <span>隐写</span>
            </label>
          </div>

          <label class="field" id="stego-password-field" hidden>
            <span>隐写密码，可留空</span>
            <input id="stego-password" type="password" autocomplete="off" />
          </label>

          <button id="draw-button" type="submit">出图</button>
          <p class="hint" id="form-hint">中文会先转成标签，再送给 NAI 4.5。</p>
        </form>
      </aside>

      <main class="stage">
        <div class="pegs" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>

        <section class="canvas" aria-labelledby="board-title">
          <div class="canvas-bar">
            <h2 id="board-title">成图</h2>
            <p id="lightbox-meta">还没有图。写画面，再出图。</p>
            <div class="canvas-actions">
              <button id="download-result" class="ghost" type="button" disabled>下载</button>
              <button id="download-stego" class="ghost" type="button" hidden>隐写 PNG</button>
            </div>
          </div>

          <figure class="cel" id="result-frame">
            <img id="result-image" alt="当前成图" hidden />
            <figcaption id="result-empty">
              <span class="cross" aria-hidden="true"></span>
              等待出图
            </figcaption>
          </figure>

          <dl class="facts" id="result-sheet" hidden>
            <div>
              <dt>预设</dt>
              <dd id="sheet-preset">—</dd>
            </div>
            <div>
              <dt>尺寸</dt>
              <dd id="sheet-size">—</dd>
            </div>
            <div>
              <dt>NSFW</dt>
              <dd id="sheet-nsfw">—</dd>
            </div>
            <div>
              <dt>脸型</dt>
              <dd id="sheet-face">—</dd>
            </div>
          </dl>

          <details class="prompt-sheet">
            <summary>正面 / 负面提示词</summary>
            <p id="sheet-prompt">—</p>
            <p id="sheet-negative">—</p>
          </details>
          <p class="note" id="result-note" hidden></p>
        </section>
      </main>
    </div>

    <section class="strip" aria-labelledby="gallery-title">
      <div class="strip-head">
        <h2 id="gallery-title">最近成图</h2>
        <p>点开一张放到成图区。</p>
      </div>
      <div class="thumbs" id="gallery"></div>
    </section>

    <section class="strip" aria-labelledby="cover-title">
      <div class="strip-head">
        <div>
          <h2 id="cover-title">载体</h2>
          <p>隐写时随机抽一张当外壳。只认原始 PNG，不要用聊天压缩图。</p>
        </div>
        <form id="cover-form" class="inline-form">
          <label class="file-pill">
            <input id="cover-file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" />
            <span>加入载体</span>
          </label>
          <p class="hint" id="cover-hint"></p>
        </form>
      </div>
      <div class="thumbs" id="covers"></div>
    </section>

    <section class="strip" aria-labelledby="extract-title">
      <div class="strip-head">
        <div>
          <h2 id="extract-title">拆封</h2>
          <p>放入机器人发出的原始隐写 PNG。</p>
        </div>
        <form id="extract-form" class="inline-form">
          <label class="field compact">
            <span>密码，没有就留空</span>
            <input id="extract-password" type="password" autocomplete="off" />
          </label>
          <label class="file-pill">
            <input id="extract-file" type="file" accept="image/png" />
            <span>选择原始 PNG</span>
          </label>
        </form>
      </div>
      <p class="hint" id="extract-hint"></p>
    </section>

    <div id="toast" class="toast" hidden role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>

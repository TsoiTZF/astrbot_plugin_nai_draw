<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>绘台</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-layout">
      <!-- 顶栏 -->
      <header class="app-header">
        <div class="header-left">
          <span class="app-title">绘台</span>
          <div class="header-status">
            <span class="status-dot" id="status-dot"></span>
            <span class="status-text" id="status-api">连接中</span>
          </div>
        </div>

        <nav class="header-nav" role="tablist">
          <button type="button" class="nav-tab active" data-tab="tab-canvas" role="tab" aria-selected="true">
            画布
          </button>
          <button type="button" class="nav-tab" data-tab="tab-history" role="tab" aria-selected="false">
            历史 <span class="tab-count" id="tab-gallery-count">0</span>
          </button>
          <button type="button" class="nav-tab" data-tab="tab-covers" role="tab" aria-selected="false">
            载体图库 <span class="tab-count" id="tab-cover-count">0</span>
          </button>
          <button type="button" class="nav-tab" data-tab="tab-stego" role="tab" aria-selected="false">
            隐写提取
          </button>
        </nav>

        <div class="header-right">
          <button type="button" id="btn-toggle-theme" class="theme-toggle" title="切换主题">
            ◐
          </button>
        </div>
      </header>

      <!-- 状态辅助隐藏域 -->
      <div hidden>
        <span id="status-model">—</span>
        <span id="status-gallery">0</span>
        <span id="status-covers">0</span>
      </div>

      <!-- 主体双栏容器 -->
      <div class="app-body">
        <!-- 左侧参数表单 (Composer) -->
        <aside class="sidebar-panel composer" aria-label="生成参数设置">
          <form id="draw-form" class="controls-form">
            <!-- 提示词输入 -->
            <div class="control-section">
              <div class="section-title-row">
                <label for="prompt" class="section-title">画面描述 (Prompt)</label>
                <div class="section-actions">
                  <button type="button" id="btn-random-prompt" class="link-btn">填入示例</button>
                  <button type="button" id="btn-clear-prompt" class="link-btn">清空</button>
                </div>
              </div>
              <textarea
                id="prompt"
                name="prompt"
                rows="4"
                required
                placeholder="输入中文或英文标签，例如：1girl, 长发, 白发, 夜景旗袍, 侧光, 高清"
              ></textarea>
            </div>

            <!-- 预设选择 -->
            <div class="control-section">
              <div class="section-title-row">
                <span class="section-title">预设风格</span>
                <span class="section-value" id="preset-summary">老五样</span>
              </div>
              <div class="segmented-grid preset-grid" id="preset-grid" role="radiogroup"></div>
            </div>

            <!-- 尺寸选择 -->
            <div class="control-section">
              <div class="section-title-row">
                <span class="section-title">画幅尺寸</span>
                <span class="section-value" id="size-summary">竖图</span>
              </div>
              <div class="segmented-grid size-grid" id="size-row" role="radiogroup"></div>
            </div>

            <!-- 画师叠加 -->
            <div class="control-section">
              <div class="section-title-row">
                <label for="artists" class="section-title">画师叠加</label>
                <span class="section-hint">可选</span>
              </div>
              <input
                id="artists"
                name="artists"
                type="text"
                class="text-input"
                placeholder="例如：artist:wlop, {artist:guweiz}"
                autocomplete="off"
              />
              <div class="tag-shortcuts">
                <button type="button" class="shortcut-tag" data-artist="artist:wlop">wlop</button>
                <button type="button" class="shortcut-tag" data-artist="artist:guweiz">guweiz</button>
                <button type="button" class="shortcut-tag" data-artist="artist:fuzichoco">fuzichoco</button>
                <button type="button" class="shortcut-tag" data-artist="artist:mika pikazo">mika</button>
                <button type="button" class="shortcut-tag" data-artist="artist:ask (artist)">ask</button>
              </div>
            </div>

            <!-- 开关选项 -->
            <div class="control-section toggles-section">
              <label class="toggle-item">
                <input id="nsfw" type="checkbox" />
                <span class="toggle-checkbox"></span>
                <span class="toggle-label">NSFW 模式</span>
              </label>

              <label class="toggle-item">
                <input id="face" type="checkbox" checked />
                <span class="toggle-checkbox"></span>
                <span class="toggle-label">自动脸型增强</span>
              </label>

              <label class="toggle-item">
                <input id="stego" type="checkbox" />
                <span class="toggle-checkbox"></span>
                <span class="toggle-label">隐写伪装</span>
              </label>
            </div>

            <!-- 隐写密码 -->
            <div class="control-section" id="stego-password-field" hidden>
              <label for="stego-password" class="section-title">隐写密码</label>
              <input
                id="stego-password"
                type="password"
                class="text-input"
                placeholder="提取密码（留空则不加密）"
                autocomplete="off"
              />
            </div>

            <!-- 提交按钮 -->
            <div class="form-submit-row">
              <button id="draw-button" type="submit" class="submit-btn">
                <span class="btn-spinner" id="draw-spinner" hidden></span>
                <span id="draw-btn-text">生成图片</span>
              </button>
              <p class="form-hint-text" id="form-hint">中文会自动转为英文标签</p>
            </div>
          </form>
        </aside>

        <!-- 右侧画布与内容区 (Workspace) -->
        <main class="main-panel workspace">
          <!-- 选项卡 1：画布 -->
          <section id="tab-canvas" class="view-tab-pane active" role="tabpanel">
            <div class="canvas-container" id="canvas-viewport">
              <div class="canvas-empty" id="result-empty">
                <span>等待生成</span>
              </div>

              <!-- 成图展示 -->
              <div class="canvas-image-wrap" id="artwork-frame" hidden>
                <img id="result-image" class="canvas-image" alt="生成结果" />
              </div>

              <!-- 底部操作与参数栏 -->
              <div class="canvas-footer-dock" id="result-dock" hidden>
                <div class="dock-actions">
                  <button type="button" id="download-result" class="dock-btn primary" disabled>
                    下载原图
                  </button>
                  <button type="button" id="download-stego" class="dock-btn" hidden>
                    下载隐写图
                  </button>
                </div>

                <div class="dock-info" id="result-sheet">
                  <span id="sheet-preset">—</span>
                  <span class="info-sep">·</span>
                  <span id="sheet-size">—</span>
                  <span class="info-sep">·</span>
                  <span id="sheet-nsfw">—</span>
                  <span class="info-sep">·</span>
                  <span id="sheet-face">—</span>
                </div>

                <details class="prompt-details">
                  <summary>查看完整提示词</summary>
                  <div class="prompt-details-body">
                    <div class="prompt-group">
                      <div class="prompt-group-header">
                        <span>正面提示词</span>
                        <button type="button" class="copy-link" id="btn-copy-prompt">复制</button>
                      </div>
                      <p id="sheet-prompt" class="prompt-code">—</p>
                    </div>
                    <div class="prompt-group">
                      <div class="prompt-group-header">
                        <span>负面提示词</span>
                        <button type="button" class="copy-link" id="btn-copy-negative">复制</button>
                      </div>
                      <p id="sheet-negative" class="prompt-code">—</p>
                    </div>
                  </div>
                </details>

                <div class="dock-note" id="result-note" hidden></div>
              </div>
            </div>
          </section>

          <!-- 选项卡 2：画廊 -->
          <section id="tab-history" class="view-tab-pane" role="tabpanel" hidden>
            <div class="tab-view-body">
              <div class="view-toolbar">
                <h2 class="view-heading">历史生成</h2>
                <button type="button" id="btn-refresh-gallery" class="action-btn">刷新</button>
              </div>
              <div class="items-grid" id="gallery"></div>
            </div>
          </section>

          <!-- 选项卡 3：载体图库 -->
          <section id="tab-covers" class="view-tab-pane" role="tabpanel" hidden>
            <div class="tab-view-body">
              <div class="view-toolbar">
                <h2 class="view-heading">载体图库</h2>
                <label class="action-btn primary">
                  <span>上传图片</span>
                  <input id="cover-file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" hidden />
                </label>
              </div>

              <div class="upload-dropzone" id="cover-drop-zone">
                <p>点击或拖拽图片到这里上传</p>
                <span class="dropzone-hint">PNG / JPG / WEBP / BMP，单张不超过 12MB</span>
                <span id="cover-hint" hidden></span>
              </div>

              <div class="items-grid" id="covers"></div>
            </div>
          </section>

          <!-- 选项卡 4：隐写提取 -->
          <section id="tab-stego" class="view-tab-pane" role="tabpanel" hidden>
            <div class="tab-view-body">
              <div class="view-toolbar">
                <h2 class="view-heading">隐写提取</h2>
              </div>

              <div class="stego-view-layout">
                <div class="stego-input-card">
                  <div class="upload-dropzone" id="extract-drop-zone">
                    <p>拖拽原始隐写 PNG 到此处</p>
                    <label class="action-btn" style="margin-top: 10px;">
                      <span>选择本地文件</span>
                      <input id="extract-file" type="file" accept="image/png" hidden />
                    </label>
                  </div>

                  <div style="margin-top: 12px;">
                    <input
                      id="extract-password"
                      type="password"
                      class="text-input"
                      placeholder="提取密码（无密码留空）"
                      autocomplete="off"
                    />
                  </div>

                  <p class="stego-status-hint" id="extract-hint"></p>
                </div>

                <div class="stego-result-card" id="extract-result-panel" hidden>
                  <div class="stego-preview-wrap">
                    <img id="extract-preview-img" alt="提取结果" />
                  </div>
                  <button type="button" id="btn-download-extracted" class="action-btn primary" style="width: 100%; margin-top: 12px;">
                    下载提取原图
                  </button>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- 简易通知 -->
    <div id="toast" class="simple-toast" hidden role="status"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
